<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Школы менеджмента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна узкая колонка; старт открывается диаграммой Ганта по периодам школ, прогресс — та же полоса Ганта из клеток-вопросов */
:root {
  --paper: #EDF0F5;
  --card: #FFFFFF;
  --ink: #131A2B;
  --muted: #576178;
  --line: #D3D9E4;
  --accent: #2443C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FA;
  --ok: #1D7447;
  --ok-soft: #E0F2E8;
  --bad: #B02A22;
  --bad-soft: #FBE4E1;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131E;
    --card: #161D2C;
    --ink: #E6EAF2;
    --muted: #9BA5B9;
    --line: #2A3346;
    --accent: #8FA5FF;
    --accent-ink: #0D1430;
    --accent-soft: #1E2847;
    --ok: #5CC68E;
    --ok-soft: #12301F;
    --bad: #F28880;
    --bad-soft: #3A1A19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131E;
  --card: #161D2C;
  --ink: #E6EAF2;
  --muted: #9BA5B9;
  --line: #2A3346;
  --accent: #8FA5FF;
  --accent-ink: #0D1430;
  --accent-soft: #1E2847;
  --ok: #5CC68E;
  --ok-soft: #12301F;
  --bad: #F28880;
  --bad-soft: #3A1A19;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 680px;
  margin-inline: auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { display: grid; gap: 20px; }

.eyebrow {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.mono {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 7vw, 44px);
  line-height: 1.1;
  letter-spacing: -.01em;
  text-wrap: balance;
}
h3 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  text-wrap: balance;
}
.lead { margin: 0; font-size: 17px; color: var(--muted); max-width: 60ch; }
.hero { display: grid; gap: 12px; }
.byline { margin: 0; font-size: 14px; color: var(--muted); }
.byline b { font-weight: 600; color: var(--ink); }

.btn {
  font: inherit;
  font-weight: 600;
  font-size: 16px;
  min-height: 52px;
  padding: 13px 24px;
  border-radius: 12px;
  border: 0;
  cursor: pointer;
  background: var(--accent);
  color: var(--accent-ink);
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.08); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Диаграмма Ганта на старте */
.gantt {
  margin: 0;
  padding: 18px;
  display: grid;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  min-width: 0;
}
.gantt figcaption { font-size: 13px; color: var(--muted); }
.g-row {
  display: grid;
  grid-template-columns: 12.5rem minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}
.g-label { display: flex; flex-direction: column; min-width: 0; }
.g-name { font-weight: 500; font-size: 14px; line-height: 1.3; }
.g-years { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.g-track { position: relative; height: 14px; }
.g-tick { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--line); }
.g-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 3px; background: var(--accent); }
.g-bar.open { background: linear-gradient(to right, var(--accent) 70%, var(--accent-soft)); }
.g-axis .g-track { height: 16px; }
.g-tlabel {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.g-tlabel:first-child { transform: none; }
.g-note { margin: 0; font-size: 13px; color: var(--muted); }

.start-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }

/* Прогресс */
.progress { display: grid; gap: 10px; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.top-name { font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.strip { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.strip li { height: 10px; border-radius: 3px; background: var(--line); }
.strip li.current { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.strip li.ok { background: var(--ok); }
.strip li.bad { background: var(--bad); }

/* Карточка вопроса */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: clamp(18px, 4.5vw, 28px);
  display: grid;
  gap: 16px;
  min-width: 0;
}
.qtext {
  margin: 0;
  font-size: clamp(19px, 4.8vw, 22px);
  line-height: 1.35;
  font-weight: 600;
  text-wrap: pretty;
}
.options { display: grid; gap: 10px; }
.opt {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 20px;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 11px 14px;
  text-align: left;
  font: inherit;
  font-size: 16px;
  line-height: 1.4;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .15s, background-color .15s, opacity .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
.opt-key {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 14px;
  background: var(--paper);
  color: var(--muted);
}
.opt-mark { font-weight: 700; font-size: 18px; text-align: center; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .opt-key { background: var(--ok); color: var(--card); }
.opt.is-correct .opt-mark { color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .opt-key { background: var(--bad); color: var(--card); }
.opt.is-wrong .opt-mark { color: var(--bad); }
.opt.is-dim { opacity: .55; }

.feedback {
  display: grid;
  gap: 10px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }
.verdict { margin: 0; font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.answer-line { margin: 0; font-weight: 500; }
.explain { margin: 0; max-width: 65ch; }
.feedback .btn { justify-self: start; margin-top: 4px; }

.kbd-hint { display: none; margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: block; } }

/* Результат */
.score-big {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(56px, 16vw, 88px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.score-big .of { font-size: .38em; font-weight: 500; color: var(--muted); margin-left: .25em; }
.r-verdict { margin: 0; font-size: 17px; }
.by-list { display: grid; gap: 14px; }
.by-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.by-name { font-size: 15px; }
.by-cells { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.by-cells i { width: 28px; height: 10px; border-radius: 3px; }
.by-cells i.ok { background: var(--ok); }
.by-cells i.bad { background: var(--bad); }
.review { display: grid; gap: 16px; }
.rv { display: grid; gap: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
.rv:first-child { padding-top: 0; border-top: 0; }
.rv-q { margin: 0; font-weight: 600; }
.rv-num { display: block; margin-bottom: 2px; }
.rv-line { margin: 0; font-size: 15px; }
.rv-line b { font-weight: 600; }
.rv-line.bad b { color: var(--bad); }
.rv-line.ok b { color: var(--ok); }
.rv-e { margin: 0; font-size: 15px; color: var(--muted); }

@media (max-width: 560px) {
  .g-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .g-label { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .g-axis .g-label { display: none; }
  .start-row .btn, .feedback .btn, #againBtn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="screen" id="start">
    <div class="hero">
      <p class="eyebrow">Менеджмент · научные школы</p>
      <h1>Школы менеджмента</h1>
      <p class="lead" id="lead"></p>
      <p class="byline">Выполнил: <b>Кучерин Роман</b>, группа ЭУ-163610</p>
    </div>
    <figure class="gantt" id="gantt">
      <figcaption>Периоды школ по учебнику Мескона, Альберта и Хедоури «Основы менеджмента»</figcaption>
    </figure>
    <div class="start-row">
      <button class="btn" id="startBtn" type="button">Начать</button>
      <span class="mono" id="startMeta"></span>
    </div>
  </section>

  <section class="screen" id="quiz" hidden>
    <div class="progress">
      <div class="p-head">
        <span class="top-name">Школы менеджмента</span>
        <span class="mono" id="counter"></span>
      </div>
      <ol class="strip" id="strip" aria-label="Прогресс по вопросам"></ol>
    </div>
    <article class="card" id="qcard">
      <h2 class="qtext" id="qtext"></h2>
      <div class="options" id="options" role="group" aria-labelledby="qtext"></div>
      <div class="feedback" id="feedback" hidden aria-live="polite">
        <p class="eyebrow" id="fbTopic"></p>
        <p class="verdict" id="verdict"></p>
        <p class="answer-line" id="answerLine" hidden></p>
        <p class="explain" id="explain"></p>
        <button class="btn" id="nextBtn" type="button">Следующий вопрос</button>
      </div>
    </article>
    <p class="kbd-hint">Можно отвечать клавишами 1–4, а переходить дальше клавишей Enter</p>
  </section>

  <section class="screen" id="result" hidden>
    <div class="progress">
      <div class="p-head">
        <span class="top-name">Школы менеджмента</span>
        <span class="mono">Готово</span>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow">Результат</p>
      <p class="score-big"><span id="rScore">0</span><span class="of" id="rOf"></span></p>
      <p class="r-verdict" id="rVerdict"></p>
    </div>
    <section class="card">
      <h3>По темам</h3>
      <div class="by-list" id="byBlock"></div>
    </section>
    <section class="card">
      <h3>Разбор ошибок</h3>
      <div class="review" id="review"></div>
    </section>
    <button class="btn" id="againBtn" type="button">Пройти ещё раз</button>
  </section>
</main>

<script>
const BLOCKS = {
  sci: 'Научное управление',
  adm: 'Классическая (административная) школа',
  hum: 'Человеческие отношения и поведенческие науки',
  quant: 'Количественная школа',
  appr: 'Подходы к управлению',
  emp: 'Эмпирическая школа',
};

// Периодизация по Мескону, Альберту и Хедоури; to: null — «по настоящее время»
const SCHOOLS = [
  { name: 'Научное управление', from: 1885, to: 1920 },
  { name: 'Административная школа', from: 1920, to: 1950 },
  { name: 'Человеческие отношения', from: 1930, to: 1950 },
  { name: 'Поведенческие науки', from: 1950, to: null },
  { name: 'Количественная школа', from: 1950, to: null },
];
const AXIS = { from: 1880, to: 2030, ticks: [1880, 1900, 1920, 1940, 1960, 1980, 2000, 2020] };

// b — блок, q — вопрос, o — варианты, c — индекс правильного, e — пояснение
const QUESTIONS = [
  {
    b: 'sci',
    q: 'Что Фредерик Тейлор считал главным способом повысить производительность труда?',
    o: [
      'Внимание к людям и хорошие отношения в рабочей группе',
      'Общие принципы администрирования фирмы в целом',
      'Хронометраж операций, нормы выработки и отбор рабочих',
      'Свобода рабочих самим выбирать удобные приёмы работы',
    ],
    c: 2,
    e: 'Тейлор, основатель школы научного управления, в 1911 году издал «Принципы научного управления». Он предлагал изучать каждую операцию с хронометражем, вводить обоснованные нормы выработки, научно отбирать и обучать рабочих и платить за результат. Свободный выбор приёмов он, наоборот, заменял единым научно обоснованным способом. Внимание к людям — тема более поздней школы человеческих отношений, а принципы администрирования фирмы — административной школы Файоля.',
  },
  {
    b: 'sci',
    q: 'Кто снимал работу на кинокамеру, чтобы разложить её на элементарные движения и убрать лишние?',
    o: ['Фрэнк и Лилиан Гилбрет', 'Генри Гант', 'Гаррингтон Эмерсон', 'Фредерик Тейлор'],
    c: 0,
    e: 'Гилбреты изучали трудовые движения: снимали работу на кинокамеру вместе с микрохронометром и раскладывали её на элементарные движения, чтобы убрать лишние. Тейлор изучал операции с секундомером. Гант известен графиком планирования работ, диаграммой Ганта (такая есть на первом экране викторины), а Эмерсон — книгой «Двенадцать принципов производительности».',
  },
  {
    b: 'adm',
    q: 'Сотрудник получает распоряжения сразу от двух начальников, и они противоречат друг другу. Какой из 14 принципов Анри Файоля нарушен?',
    o: ['Разделение труда', 'Стабильность рабочего места для персонала', 'Справедливость', 'Единоначалие'],
    c: 3,
    e: 'По принципу единоначалия работник получает приказы только от одного непосредственного начальника, иначе возникают путаница и конфликты. Разделение труда, справедливость и стабильность рабочего места тоже входят в 14 принципов Файоля, но к этой ситуации не относятся. Свои принципы Файоль изложил в книге «Общее и промышленное управление» (1916).',
  },
  {
    b: 'adm',
    q: 'Макс Вебер описал «идеальный» тип организации: чёткая иерархия, письменные правила, безличные отношения, найм по квалификации. Как он его назвал?',
    o: ['Органическая структура', 'Рациональная бюрократия', 'Неформальная организация', 'Матричная структура'],
    c: 1,
    e: 'Вебер считал рациональную бюрократию самой эффективной формой организации: всё держится на правилах и квалификации, а не на личных связях. Он был социологом, но его модель изучают вместе с классической школой, потому что она тоже ищет универсальные правила построения организации. Органическую структуру описали Бернс и Сталкер, а неформальная организация — противоположность формальной модели Вебера.',
  },
  {
    b: 'hum',
    q: 'В Хоторнских экспериментах выработка росла почти при любых изменениях условий труда, даже при возврате к исходным. Какой вывод сделали Элтон Мэйо и его коллеги?',
    o: [
      'Социальные факторы влияют на выработку не меньше, чем деньги и условия',
      'Выработку повышают прежде всего чёткие операции и строгие нормы',
      'Главный стимул для рабочего — размер сдельной оплаты и премий',
      'Рабочие трудятся лучше всего под жёстким контролем мастера',
    ],
    c: 0,
    e: 'Рабочие чувствовали внимание к себе и сплотились в группу, поэтому трудились лучше, что бы ни меняли исследователи. Вывод: социальные и психологические факторы влияют на производительность не меньше, чем деньги и физические условия. Эксперименты шли в 1924–1932 годах на Хоторнском заводе компании Western Electric под Чикаго (отсюда название), и с них началась школа человеческих отношений.',
  },
  {
    b: 'hum',
    q: 'Бригада работает на групповой сдельной оплате, но рабочие держат выработку на одном уровне, а тех, кто работает быстрее, коллеги осуждают. Что это иллюстрирует?',
    o: [
      'Нарушение принципа единоначалия',
      'Слишком узкое разделение труда',
      'Влияние норм неформальной группы',
      'Действие формальных правил и инструкций',
    ],
    c: 2,
    e: 'Так было в одной из серий Хоторнских экспериментов: бригада сама установила «справедливую» норму выработки и давила на тех, кто её превышал. Нормы неформальной группы оказались сильнее денежного стимула. Единоначалие, разделение труда и инструкции относятся к формальной организации, а здесь давление идёт от самих коллег.',
  },
  {
    b: 'hum',
    q: 'У сотрудника хорошая зарплата, стабильная работа, и в коллективе его приняли как своего. По иерархии Маслоу, какая потребность выйдет у него на первый план следующей?',
    o: [
      'Потребность в безопасности и уверенности в будущем',
      'Потребность в уважении и признании',
      'Потребность в самовыражении',
      'Социальная потребность (принадлежность к группе)',

const N = QUESTIONS.length;
const LETTERS = ['А', 'Б', 'В', 'Г'];
const $ = id => document.getElementById(id);
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let state = freshState();

function shuffled(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function freshState() {
  return {
    screen: 'start',
    idx: 0,
    orders: QUESTIONS.map(q => shuffled(q.o.length)),
    answers: QUESTIONS.map(() => null),
  };
}

function validState(s) {
  if (!s || !['start', 'quiz', 'result'].includes(s.screen)) return false;
  if (!Number.isInteger(s.idx) || s.idx < 0 || s.idx >= N) return false;
  if (!Array.isArray(s.orders) || s.orders.length !== N) return false;
  if (!Array.isArray(s.answers) || s.answers.length !== N) return false;
  return s.orders.every((o, i) => Array.isArray(o) && o.length === QUESTIONS[i].o.length &&
    [...o].sort().every((v, k) => v === k)) &&
    s.answers.every((a, i) => a === null || (Number.isInteger(a) && a >= 0 && a < QUESTIONS[i].o.length));
}

function make(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const pct = year => ((year - AXIS.from) / (AXIS.to - AXIS.from)) * 100;

function buildGantt() {
  const fig = $('gantt');
  const nowYear = Math.min(new Date().getFullYear(), AXIS.to);
  const track = () => {
    const t = make('div', 'g-track');
    AXIS.ticks.forEach(y => {
      const tick = make('i', 'g-tick');
      tick.style.left = pct(y) + '%';
      t.appendChild(tick);
    });
    return t;
  };
  SCHOOLS.forEach(s => {
    const row = make('div', 'g-row');
    const label = make('div', 'g-label');
    label.append(make('span', 'g-name', s.name),
      make('span', 'g-years', s.to ? `${s.from}–${s.to}` : `${s.from} — наст. время`));
    const t = track();
    const bar = make('span', 'g-bar' + (s.to ? '' : ' open'));
    const end = s.to ?? nowYear;
    bar.style.left = pct(s.from) + '%';
    bar.style.width = (pct(end) - pct(s.from)) + '%';
    t.appendChild(bar);
    row.append(label, t);
    fig.appendChild(row);
  });
  const axis = make('div', 'g-row g-axis');
  axis.setAttribute('aria-hidden', 'true');
  const at = make('div', 'g-track');
  AXIS.ticks.forEach(y => {
    const l = make('span', 'g-tlabel', String(y));
    l.style.left = pct(y) + '%';
    at.appendChild(l);
  });
  axis.append(make('div', 'g-label'), at);
  fig.appendChild(axis);
  fig.appendChild(make('p', 'g-note',
    'Кроме школ, в викторине есть процессный, системный и ситуационный подходы и эмпирическая школа.'));
}

function blockOrder() {
  const seen = [];
  QUESTIONS.forEach(q => { if (!seen.includes(q.b)) seen.push(q.b); });
  return seen;
}

function show(screen) {
  ['start', 'quiz', 'result'].forEach(s => { $(s).hidden = s !== screen; });
  state.screen = screen;
}

function correctCount() {
  return state.answers.filter((a, i) => a !== null && a === QUESTIONS[i].c).length;
}

function renderStrip() {
  const strip = $('strip');
  if (strip.children.length !== N) {
    strip.innerHTML = '';
    strip.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;
    QUESTIONS.forEach(() => strip.appendChild(make('li')));
  }
  [...strip.children].forEach((li, i) => {
    const a = state.answers[i];
    let cls = '', label = `Вопрос ${i + 1}`;
    if (a !== null) {
      const ok = a === QUESTIONS[i].c;
      cls = ok ? 'ok' : 'bad';
      label += ok ? ': верно' : ': неверно';
    } else if (i === state.idx) {
      cls = 'current';
      label += ': сейчас';
    }
    li.className = cls;
    li.setAttribute('aria-label', label);
  });
}

function renderQuestion() {
  const i = state.idx;
  const q = QUESTIONS[i];
  $('counter').textContent = `Вопрос ${i + 1} из ${N}`;
  $('qtext').textContent = q.q;
  const box = $('options');
  box.innerHTML = '';
  state.orders[i].forEach((orig, pos) => {
    const btn = make('button', 'opt');
    btn.type = 'button';
    btn.dataset.orig = orig;
    btn.append(make('span', 'opt-key', LETTERS[pos]), make('span', 'opt-text', q.o[orig]),
      make('span', 'opt-mark'));
    btn.querySelector('.opt-mark').setAttribute('aria-hidden', 'true');
    btn.addEventListener('click', () => choose(orig));
    box.appendChild(btn);
  });
  $('feedback').hidden = true;
  renderStrip();
  if (state.answers[i] !== null) applyAnswer(false);
}

function choose(orig) {
  const i = state.idx;
  if (state.answers[i] !== null) return;
  state.answers[i] = orig;
  applyAnswer(true);
}

function applyAnswer(fromClick) {
  const i = state.idx;
  const q = QUESTIONS[i];
  const chosen = state.answers[i];
  const ok = chosen === q.c;
  [...$('options').children].forEach(btn => {
    const orig = Number(btn.dataset.orig);
    btn.disabled = true;
    const mark = btn.querySelector('.opt-mark');
    if (orig === q.c) {
      btn.classList.add('is-correct');
      mark.textContent = '✓';
    } else if (orig === chosen) {
      btn.classList.add('is-wrong');
      mark.textContent = '✕';
    } else {
      btn.classList.add('is-dim');
    }
  });
  // Тема видна только после ответа, иначе она подсказывает ответ
  $('fbTopic').textContent = q.t || BLOCKS[q.b];
  const verdict = $('verdict');
  verdict.textContent = ok ? 'Верно!' : 'Неверно';
  verdict.className = 'verdict ' + (ok ? 'ok' : 'bad');
  const line = $('answerLine');
  line.hidden = ok;
  line.textContent = ok ? '' : `Правильный ответ: ${q.o[q.c]}`;
  $('explain').textContent = q.e;
  $('nextBtn').textContent = i === N - 1 ? 'Показать результат' : 'Следующий вопрос';
  const fb = $('feedback');
  fb.hidden = false;
  renderStrip();
  if (fromClick) {
    $('nextBtn').focus({ preventScroll: true });
    fb.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }
}

function next() {
  if (state.answers[state.idx] === null) return;
  if (state.idx < N - 1) {
    state.idx++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'auto' });
  } else {
    show('result');
    renderResult();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

function verdictText(c) {
  if (c === N) return 'Все ответы верные. Школы менеджмента ты знаешь отлично!';
  if (c >= Math.ceil(N * 0.8)) return 'Отличный результат. Ниже разбор вопросов, где была ошибка.';
  if (c >= Math.ceil(N * 0.6)) return 'Хороший результат. Загляни в разбор ошибок ниже.';
  if (c >= Math.ceil(N * 0.4)) return 'Неплохо, но пару школ стоит повторить. Разбор ниже.';
  return 'Стоит повторить тему и пройти викторину ещё раз. Разбор ниже.';
}

function renderResult() {
  const c = correctCount();
  $('rScore').textContent = c;
  $('rOf').textContent = `/ ${N}`;
  $('rVerdict').textContent = verdictText(c);

  const by = $('byBlock');
  by.innerHTML = '';
  blockOrder().forEach(b => {
    const idxs = QUESTIONS.map((q, i) => (q.b === b ? i : -1)).filter(i => i >= 0);
    const right = idxs.filter(i => state.answers[i] === QUESTIONS[i].c).length;
    const row = make('div', 'by-row');
    const cells = make('div', 'by-cells');
    cells.setAttribute('aria-hidden', 'true');
    idxs.forEach(i => cells.appendChild(make('i', state.answers[i] === QUESTIONS[i].c ? 'ok' : 'bad')));
    row.append(make('span', 'by-name', BLOCKS[b]), make('span', 'mono', `${right} из ${idxs.length}`), cells);
    by.appendChild(row);
  });

  const review = $('review');
  review.innerHTML = '';
  const wrong = QUESTIONS.map((q, i) => i).filter(i => state.answers[i] !== QUESTIONS[i].c);
  if (!wrong.length) {
    review.appendChild(make('p', 'rv-e', 'Ошибок нет, разбирать нечего.'));
    return;
  }
  wrong.forEach(i => {
    const q = QUESTIONS[i];
    const item = make('div', 'rv');
    const head = make('p', 'rv-q');
    head.append(make('span', 'mono rv-num', `Вопрос ${i + 1}`), document.createTextNode(q.q));
    const yours = make('p', 'rv-line bad');
    yours.append(make('b', null, 'Твой ответ: '),
      document.createTextNode(state.answers[i] === null ? '—' : q.o[state.answers[i]]));
    const right = make('p', 'rv-line ok');
    right.append(make('b', null, 'Правильно: '), document.createTextNode(q.o[q.c]));
    item.append(head, yours, right, make('p', 'rv-e', q.e));
    review.appendChild(item);
  });
}

function startQuiz() {
  state = freshState();
  show('quiz');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'auto' });
  const first = $('options').querySelector('button');
  if (first) first.focus({ preventScroll: true });
}

document.addEventListener('keydown', e => {
  if (state.screen !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey) return;
  const pos = ['1', '2', '3', '4'].indexOf(e.key);
  if (pos >= 0 && state.answers[state.idx] === null) {
    const orig = state.orders[state.idx][pos];
    if (orig !== undefined) { e.preventDefault(); choose(orig); }
  } else if (e.key === 'Enter' && state.answers[state.idx] !== null && document.activeElement !== $('nextBtn')) {
    e.preventDefault();
    next();
  }
});

function boot(data) {
  try {
    if (data && validState(data.state)) state = data.state;
  } catch (err) { /* начинаем с чистого листа */ }
  const blocks = blockOrder().length;
  $('lead').textContent = `${N} вопросов о том, как менялись взгляды на управление: от хронометража Тейлора до управления по целям Друкера. После каждого ответа сразу видно, верно ли, и короткое пояснение.`;
  $('startMeta').textContent = `${N} вопросов · ${blocks} тем · 4 варианта ответа`;
  buildGantt();
  $('startBtn').addEventListener('click', startQuiz);
  $('nextBtn').addEventListener('click', next);
  $('againBtn').addEventListener('click', startQuiz);
  show(state.screen);
  if (state.screen === 'quiz') renderQuestion();
  if (state.screen === 'result') renderResult();
}

boot({});
</script>
